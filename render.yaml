services:
  - type: web
    name: foodrush-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: CORS_ORIGINS
        value: https://foodrush-frontend.onrender.com
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: foodrush-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start:prod -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://foodrush-backend.onrender.com/api
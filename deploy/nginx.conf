# FoodRush — Nginx reverse proxy & load balancer
#
# Distributes traffic across multiple backend instances. Real-time (SSE)
# events are fanned out over Redis pub/sub, so any instance can serve any
# client — no sticky sessions required. SSE connections are still kept alive
# with a long read timeout and disabled buffering.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;          # upload size limit

    # ---- Upstream backend pool -------------------------------------------
    upstream foodrush_backend {
        # least_conn spreads long-lived SSE connections evenly.
        least_conn;
        server foodrush-web-1:3000 max_fails=3 fail_timeout=15s;
        server foodrush-web-2:3000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # ---- Security headers (Helmet-equivalent) --------------------------
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---- Health / readiness (served by the backend) --------------------
        location = /api/health {
            proxy_pass http://foodrush_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
        location = /api/health/ready {
            proxy_pass http://foodrush_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # ---- Real-time (SSE) -----------------------------------------------
        # Disable buffering so events stream to the client immediately.
        location /api/orders/events {
            proxy_pass http://foodrush_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # ---- Everything else -----------------------------------------------
        location / {
            proxy_pass http://foodrush_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}

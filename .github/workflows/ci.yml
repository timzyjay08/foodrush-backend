name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint || true

      - name: Type check
        run: npm exec tsc -- --noEmit --pretty false

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t foodrush-web:ci .

      # The full end-to-end runtime (Postgres + Redis + Nginx) is exercised in
      # docker-compose. Add integration/e2e steps here once a test suite exists.
